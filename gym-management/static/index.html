<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IronPulse · Gym Management</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230e0f11'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/dashboard"><span class="logo">⚡</span> IronPulse<small>Gym Management</small></a>
    <nav id="nav">
      <a href="#/dashboard" data-page="dashboard">Dashboard</a>
      <a href="#/members" data-page="members">Members</a>
      <a href="#/challenges" data-page="challenges">Challenges</a>
      <a href="#/leaderboard" data-page="leaderboard">Leaderboard</a>
      <a href="#/rewards" data-page="rewards">Rewards</a>
      <a href="#/social" data-page="social">Social</a>
      <a href="#/progress" data-page="progress">Progress</a>
    </nav>
    <label class="who">Viewing as
      <select id="who" aria-label="Active member"></select>
    </label>
  </header>

  <main id="view"><div class="empty">Loading…</div></main>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="x" onclick="closeModal()" aria-label="Close">×</button>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
